<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humus Audax — Web page in progress</title>
<meta name="description" content="Humus Audax · Bold Event Development. Web page in progress.">
<meta name="theme-color" content="#3a3f33">
<style>
  :root {
    --tierra: #3a3f33;
    --hueso: #d9d5c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--tierra);
    color: var(--hueso);
    font-family: 'Oswald', 'Arial Narrow', Arial, sans-serif;
    overflow: hidden;
  }

  /* ---------- Patrón orgánico ---------- */
  .pattern {
    position: fixed;
    inset: -4%;
    width: 108%;
    height: 108%;
    display: block;
    animation: drift 60s ease-in-out infinite alternate;
  }
  .pattern path {
    fill: var(--hueso);
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    scale: 0.6;
    animation:
      appear 1.4s cubic-bezier(.2,.7,.2,1) var(--d, 0s) forwards,
      breathe var(--t, 9s) ease-in-out var(--b, 0s) infinite;
    transition: translate 0.9s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes appear {
    to { opacity: 1; scale: 1; }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(0.92) rotate(var(--r, 1deg)); }
  }
  @keyframes drift {
    from { transform: translate(-1.5%, -1%) scale(1); }
    to   { transform: translate(1.5%, 1%) scale(1.04); }
  }

  /* ---------- Centro ---------- */
  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    pointer-events: none;
  }
  .plate {
    pointer-events: auto;
    width: min(90vw, 560px);
    aspect-ratio: 1 / 1;
    background: var(--tierra);
    border-radius: 46% 54% 52% 48% / 50% 45% 55% 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 clamp(8px, 1.6vw, 14px) var(--tierra), 0 30px 80px rgba(0,0,0,0.35);
    animation: morph 14s ease-in-out infinite alternate, rise 1.2s cubic-bezier(.2,.7,.2,1) .5s both;
  }
  @keyframes morph {
    0%   { border-radius: 46% 54% 52% 48% / 50% 45% 55% 50%; }
    50%  { border-radius: 55% 45% 44% 56% / 44% 56% 46% 54%; }
    100% { border-radius: 48% 52% 58% 42% / 56% 48% 52% 44%; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  .logo {
    width: 76%;
    height: auto;
    display: block;
    fill: #f2f0eb;
    overflow: visible;
  }
  .logo .symbol {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: symbol-in 1.4s cubic-bezier(.2,.7,.2,1) .9s both;
  }
  @keyframes symbol-in {
    from { opacity: 0; transform: translateY(14px) scaleY(.85); }
    to   { opacity: 1; transform: none; }
  }
  .logo .dot { animation: dot 1.5s ease-in-out infinite; }
  .logo .dot:nth-of-type(2) { animation-delay: .2s; }
  .logo .dot:nth-of-type(3) { animation-delay: .4s; }
  @keyframes dot {
    0%, 60%, 100% { opacity: .15; }
    30%           { opacity: 1; }
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .pattern, .plate, .logo .symbol, .logo .dot { animation: none; }
    .logo .dot { opacity: 1; }
    .pattern path { animation: none; opacity: 1; scale: 1; transition: none; }
  }
</style>
</head>

  }
  window.addEventListener('pointermove', move, { passive: true });
  window.addEventListener('pointerleave', function () {
    last = null;
    data.forEach(function (c) { c.el.style.translate = '0px 0px'; });
  });
})();
</script>
</body>
